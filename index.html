  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Globale Absicherung gegen horizontales Scrollen auf Mobil (08/2026).
    Einzelne Elemente sollten ohnehin nie breiter als der Viewport werden,
    aber diese Regel fängt Restfälle ab (z.B. sehr lange unbrechbare Wörter,
    Rundungsfehler bei Prozent-/Padding-Kombinationen) und verhindert, dass
    daraus eine seitlich wegziehbare Seite wird — wirkt sonst unfertig.
  -->
  <style>
    /*
      #root zusätzlich zu html/body abgesichert: bekannte iOS-Safari-Lücke,
      bei der der Body trotz overflow-x:hidden durch elastisches
      "Rubber-Band"-Scrollen seitlich wegziehbar bleiben kann, wenn nicht
      auch der eigentliche App-Container begrenzt ist (08/2026).
    */
    html, body, #root { max-width: 100%; overflow-x: hidden; }
    /*
      Kein echter Überlauf vorhanden (per Konsolen-Check bestätigt) — das
      seitliche "Hin- und Herschubsen" war iOS Safaris eingebautes
      elastisches Rubber-Band-Verhalten, das standardmäßig auch ohne
      überlaufenden Inhalt aktiv ist. overscroll-behavior-x schaltet gezielt
      nur die horizontale Achse ab, vertikales Scrollen/Bouncen bleibt normal
      erhalten (wie bei Taxfix u.ä.). touch-action ergänzt das auf
      Touch-Geräten zusätzlich auf Gesten-Ebene (08/2026).
    */
    html, body { overscroll-behavior-x: none; touch-action: pan-y; }
    /*
      Reines Sicherheitsnetz für sehr lange, unbrechbare Wörter (z.B. in
      Ratgeber-Artikeln) — bricht im Extremfall mitten im Wort um, statt
      über den Container hinauszulaufen. `hyphens:auto` wurde bewusst NICHT
      global gesetzt: hat auf der Startseite "Transparent" unerwünscht zu
      "Transpa-rent" getrennt, obwohl gar keine Not dazu bestand (Browser
      trennen bei knappem Platz teils schon vorsorglich, nicht nur im
      Notfall). Die ursprüngliche Ursache (langes Wort "Nebenkostenab-
      rechnung" in der Hero-Überschrift) ist ohnehin durch die kürzere
      Formulierung "Deine Abrechnung" behoben (08/2026).
    */
    * { overflow-wrap: break-word; }
  </style>
