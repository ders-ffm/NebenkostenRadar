# ─────────────────────────────────────────────────────────────────────────
# Verhindert, dass das kostenlose Supabase-Projekt nach 7 Tagen Inaktivität
# automatisch pausiert wird (siehe scripts/supabase-keepalive.mjs).
# ─────────────────────────────────────────────────────────────────────────
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 5 * * *" # täglich 05:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-keepalive.mjs
