# ─────────────────────────────────────────────────────────────────────────
# Verschickt täglich die Rabatt-Mail an Kunden, deren Kauf 10 Monate her ist
# (nur mit Opt-in). Siehe scripts/marketing-rabatt-versand.mjs.
#
# NEU (08/2026). $0 Zusatzkosten — läuft auf GitHub Actions, nicht auf Vercel
# (gleiches Muster wie richtwerte-monitor.yml).
#
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables →
# Actions → "New repository secret"):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY
# ─────────────────────────────────────────────────────────────────────────
name: Marketing-Rabatt-Mail versenden

on:
  schedule:
    - cron: "0 8 * * *" # täglich 08:00 UTC (10:00 MESZ / 09:00 MEZ)
  workflow_dispatch: {} # manueller Start zum Testen (Actions-Tab → "Run workflow")

jobs:
  versand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Fehlte bisher (11.08.2026, echter Bug — gleiche Ursache in allen 4
      # Workflows dieses Projekts): ohne diesen Schritt fehlt node_modules,
      # der Import von "@supabase/supabase-js"/"resend" schlägt fehl.
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Rabatt-Mails verschicken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/marketing-rabatt-versand.mjs
